commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: betterleaks
      run: betterleaks git --pre-commit --staged
    - name: biome
      run: pnpm exec biome check --staged --no-errors-on-unmatched
    - name: knip
      glob: "*.{ts,tsx}"
      run: pnpm exec knip
    - name: markdownlint
      glob: "*.md"
      exclude:
        - "docs/db/*.md"
      run: pnpm exec markdownlint-cli2 {staged_files}
    - name: stylelint
      glob: "*.css"
      run: pnpm exec stylelint {staged_files}
    - name: yamllint
      glob: "*.{yml,yaml}"
      run: mise run yamllint --strict {staged_files}
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    - name: zizmor
      glob: ".github/workflows/*.{yml,yaml}"
      run: zizmor --persona=pedantic --offline {staged_files}
    - name: tombi-format
      glob: "*.toml"
      run: tombi format --check {staged_files}
    - name: tombi-lint
      glob: "*.toml"
      run: tombi lint {staged_files}
    - name: drizzle-check
      glob: "apps/api/drizzle/*"
      run: pnpm --filter @hono-poc/api db:check
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
    - name: depcruise-api
      glob: "apps/api/src/*.ts"
      run: pnpm --filter @hono-poc/api depcruise
    - name: depcruise-web
      glob: "apps/web/src/*.{ts,tsx}"
      run: pnpm --filter @hono-poc/web depcruise

pre-push:
  parallel: true
  jobs:
    - name: betterleaks
      run: betterleaks git --log-opts "origin/main..HEAD"
    - name: test-unit
      run: pnpm --filter @hono-poc/api test:unit
    - name: test-api
      run: pnpm --filter @hono-poc/api test:api
    - name: test-web
      run: pnpm --filter @hono-poc/web test
