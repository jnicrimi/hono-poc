name: test-e2e

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-e2e:
    name: test-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] actionlint 1.7.12 が $/ 構文に未対応のため
      - name: Install Playwright browser
        run: pnpm --filter @hono-poc/web exec playwright install --with-deps chromium
      - uses: ./.github/actions/database  # zizmor: ignore[self-repository] actionlint 1.7.12 が $/ 構文に未対応のため
      - name: Run E2E tests
        run: pnpm --filter @hono-poc/web e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
