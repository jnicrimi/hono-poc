name: test-web

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-web:
    name: test-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # カバレッジレポートを PR にコメントするため
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup  # zizmor: ignore[self-repository] actionlint 1.7.12 が $/ 構文に未対応のため
      - name: Run web tests
        run: pnpm --filter @hono-poc/web test:coverage
      - name: Report coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73  # v2.13.0
        with:
          working-directory: ./apps/web
          name: web
