name: setup
description: mise でツールをセットアップし、依存関係をインストールする

inputs:
  mise-install-args:
    description: mise-action に渡すツール指定
    required: false
    default: node pnpm

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c  # v5.2.6
      with:
        install_args: ${{ inputs.mise-install-args }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
