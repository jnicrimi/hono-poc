name: setup
description: mise でツールをセットアップし、依存関係をインストールする

inputs:
  mise-install-args:
    description: mise-action に渡すツール指定
    required: false
    default: node pnpm

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
      with:
        install_args: ${{ inputs.mise-install-args }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
