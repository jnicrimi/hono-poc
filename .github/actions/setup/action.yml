name: setup
description: mise でツールをセットアップし、依存関係をインストールする

inputs:
  mise-install-args:
    description: mise-action に渡すツール指定
    required: false
    default: node pnpm

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      with:
        install_args: ${{ inputs.mise-install-args }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
