name: setup
description: mise でツールをセットアップし、依存関係をインストールする

inputs:
  mise-install-args:
    description: mise-action に渡すツール指定
    required: false
    default: node pnpm

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1
      with:
        install_args: ${{ inputs.mise-install-args }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
