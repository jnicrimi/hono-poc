name: setup
description: mise でツールをセットアップし、依存関係をインストールする

inputs:
  mise-install-args:
    description: mise-action に渡すツール指定
    required: false
    default: node pnpm

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      with:
        install_args: ${{ inputs.mise-install-args }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
